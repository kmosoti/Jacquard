name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # The runner image's Chrome; the renderer tests fail rather than skip without one.
      JACQUARD_CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install WASM toolchain dependencies (binaryen & wasm-bindgen-cli 0.2.130)
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen zstd jq
          if ! command -v wasm-bindgen >/dev/null 2>&1 || [ "$(wasm-bindgen --version | awk '{print $2}')" != "0.2.130" ]; then
            cargo install --locked wasm-bindgen-cli --version 0.2.130
          fi

      # The base for check-trust-boundary: the target branch for a pull
      # request, the previous head for a push to the default branch, and the
      # default branch otherwise. The first push of the default branch uses
      # the root commit, which has no base of its own. A base that cannot be
      # resolved fails the gate.
      - name: Resolve the trust-boundary base
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            base="origin/$BASE_REF"
          elif [ "$REF_NAME" = "$DEFAULT" ]; then
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              base="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
            else
              base="$BEFORE"
            fi
          else
            base="origin/$DEFAULT"
          fi
          echo "TRUST_BASE=$base" >> "$GITHUB_ENV"

      - name: Fast checks with receipts
        run: cargo xtask checks --profile fast --base "$TRUST_BASE"

      - name: Cockpit Hydrate WASM check
        run: cargo check --manifest-path products/cockpit/Cargo.toml -p cockpit-leptos --no-default-features --features hydrate,islands --target wasm32-unknown-unknown --locked

      - name: Keep the receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: receipts
          path: target/verification/receipts/
