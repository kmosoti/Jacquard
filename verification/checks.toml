# The check registry. A receipt names one of these by `check_id`, and its
# `command` must begin with the registered command up to the first
# `<placeholder>`. `cargo xtask checks --profile fast` runs the `fast` set,
# the set CI runs on every push. Adding, removing or changing a check is a
# verifier change (AGENTS.md rule 10).

[checks.cargo-fmt]
command = "cargo fmt --all --check"
what = "formatting of every workspace target"
unchecked = "formatting only"
profile = "fast"

[checks.cargo-check]
command = "cargo check --workspace --locked --all-targets"
what = "the workspace compiles with the locked resolution"
unchecked = "fixture workspaces under tests/fixtures are data and are not compiled"
profile = "fast"

[checks.cargo-clippy]
command = "cargo clippy --workspace --all-targets --locked -- -D warnings"
what = "lints including pedantic, warnings as errors"
unchecked = "anything a lint cannot see"
profile = "fast"

[checks.cargo-test]
command = "cargo test --workspace --locked"
what = "unit and integration tests, including every gate's negative controls"
unchecked = "a test written alongside its code is a regression test, not evidence for a property"
profile = "fast"

[checks.check-layers]
command = "cargo xtask check-layers"
what = "the dependency rule of ADR-0000 over the declared and resolved graphs"
unchecked = "module-level structure inside a crate"
profile = "fast"

[checks.check-core-purity]
command = "cargo xtask check-core-purity"
what = "the purity policy over crates/core: no_std, forbid(unsafe_code), no build script, allowlisted dependencies, no std in sources"
unchecked = "effects reached through an allowlisted crate; the std scan is syntactic"
profile = "fast"

[checks.check-trust-boundary]
command = "cargo xtask check-trust-boundary --base <ref>"
what = "every commit (including merge combined diffs) since the merge base declares its oracle changes (ADR-0001)"
unchecked = "whether a declared change weakens anything; the escape-hatch scan is syntactic"
profile = "fast"

[checks.receipts-validate]
command = "cargo xtask receipts validate"
what = "every committed receipt names a registered check, its command and a supported outcome"
unchecked = "receipts are not signed; a receipt proves structure, not that the command ran"
profile = "fast"

[checks.admission-set]
command = "cargo run --quiet --package jacquard -- admission verify"
what = "every admission pair is a known answer: its defect's probe rule passes on the base and fails on the variant (ADR-0005)"
unchecked = "only the pair's own rule is asserted per pair; that bases are clean on every rule is shown by `jacquard render`, not asserted; Chrome versions and fonts differ between machines"
profile = "fast"

[checks.mutants-semantic]
command = "cargo xtask mutants semantic"
what = "every wrong behavior in tests/semantic-mutants/corpus.toml is caught by its named test, which passes without it (ADR-0007)"
unchecked = "only the wrong behaviors the corpus names; generic mutation coverage is a scheduled calibration, not this check"
profile = "fast"

[checks.cockpit-fmt]
command = "cargo fmt --manifest-path products/cockpit/Cargo.toml --all --check"
what = "formatting of every workspace crate in products/cockpit"
unchecked = "formatting only"
profile = "fast"

[checks.cockpit-clippy]
command = "cargo clippy --manifest-path products/cockpit/Cargo.toml --workspace --all-targets --locked -- -D warnings"
what = "strict clippy lints (pedantic, forbid unsafe, missing_docs) across products/cockpit"
unchecked = "anything a static lint cannot observe"
profile = "fast"

[checks.cockpit-hallmark-wcag]
command = "cargo test --manifest-path products/cockpit/Cargo.toml -p cockpit-leptos --locked --test hallmark_sloplint"
what = "Hallmark Floor/Reflex/Ledger CSS layers, OKLCH WCAG 2.2 AA contrast (>= 4.5:1 / >= 3.0:1 + negative control), and semantic SSR Island shell"
unchecked = "live browser rendering outside SSR HTML and static OKLCH token verification"
profile = "fast"

[checks.cockpit-idle-runtime]
command = "cargo test --manifest-path products/cockpit/Cargo.toml -p cockpit-leptos --locked --test store_runtime"
what = "0 Hz settled idle SSE bridge rule, generic example-cluster DTO invariants, and wiki traversal/RSS/Atom checks"
unchecked = "browser EventSource network delivery beyond pure Sans-I/O bridge transitions"
profile = "fast"

[checks.cockpit-workspace-tests]
command = "cargo test --manifest-path products/cockpit/Cargo.toml --workspace --locked"
what = "all unit and integration tests across iso-diagram, telemetry-scene, cockpit-wiki, and cockpit-leptos"
unchecked = "browser hydration beyond SSR and wasm32 compilation"
profile = "fast"

[checks.cockpit-wasm-hydrate]
command = "cargo check --manifest-path products/cockpit/Cargo.toml -p cockpit-leptos --no-default-features --features hydrate --target wasm32-unknown-unknown --locked"
what = "cockpit-leptos compiles cleanly for wasm32-unknown-unknown under the lean hydrate Islands feature profile"
unchecked = "runtime browser execution of the compiled module"
profile = "fast"

[checks.cockpit-wasm-budget]
command = "cargo run --quiet --package jacquard --locked -- product budget --product cockpit"
what = "wasm-bindgen + wasm-opt -Oz bundle size of cockpit-leptos hydrate Islands target stays <= 250 KiB (256000 B)"
unchecked = "brotli/gzip network transfer size beyond raw post-wasm-opt bytes"
profile = "fast"
