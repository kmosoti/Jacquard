<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notification settings</title>
<style>*{box-sizing:border-box}html{font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1f1d1a;background:#f5f3ef}body{margin:0}main{max-width:640px;margin:0 auto;padding:32px 20px}h1{font-size:28px;line-height:1.2;margin:0 0 12px}h2{font-size:18px;margin:24px 0 8px}p{margin:0 0 12px}.muted{color:#5b574f}.card{background:#fff;border:1px solid #dcd7cd;border-radius:10px;padding:20px;margin:16px 0}.btn{display:inline-block;min-height:44px;padding:10px 18px;border:0;border-radius:8px;background:#3f35c4;color:#fff;font:600 16px/24px system-ui,sans-serif;text-decoration:none}.btn.secondary{background:#fff;color:#3f35c4;border:1px solid #3f35c4}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0}dt{color:#5b574f}dd{margin:0}</style>
</head>
<body>
<main>
<h1>Notifications</h1>
<p class="muted">Choose what reaches you, and where.</p>
<div class="card">
<h2>Email</h2>
<p><label><input type="checkbox" checked style="width:24px;height:24px;vertical-align:middle"> Weekly summary</label></p>
<p><label><input type="checkbox" style="width:24px;height:24px;vertical-align:middle"> Every new comment</label></p>
<h2>Quiet hours</h2>
<div class="row"><label for="from">From</label><input id="from" value="22:00" style="min-height:44px;padding:8px 12px;font:16px system-ui;border:1px solid #b9b3a7;border-radius:8px;width:110px"><label for="to">to</label><input id="to" value="07:00" style="min-height:44px;padding:8px 12px;font:16px system-ui;border:1px solid #b9b3a7;border-radius:8px;width:110px"></div>
</div>
<div class="row"><button class="btn">Save changes</button><button class="btn secondary">Cancel</button></div>
</main>
</body>
</html>
