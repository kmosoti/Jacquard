[workspace]
resolver = "3"
members = [
    "crates/core/*",
    "crates/ports/*",
    "crates/app/*",
    "crates/adapters/*",
    "crates/bin/*",
]

[workspace.package]
version = "0.1.1-alpha.1"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
repository = "https://github.com/kmosoti/Jacquard"
publish = false

[workspace.dependencies]
jacquard-core = { path = "crates/core/jacquard-core" }
jacquard-ports = { path = "crates/ports/jacquard-ports" }
jacquard-app = { path = "crates/app/jacquard-app" }
jacquard-ledger-fs = { path = "crates/adapters/jacquard-ledger-fs" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
