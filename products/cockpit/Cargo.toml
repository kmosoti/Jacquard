[workspace]
resolver = "3"
members = [
    "crates/iso-diagram",
    "crates/telemetry-scene",
    "crates/cockpit-wiki",
    "crates/cockpit-leptos",
]

[workspace.package]
version = "0.1.1-alpha.1"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
repository = "https://github.com/kmosoti/Jacquard"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
