[package]
name = "jacquard"
description = "The factory's command line: the composition root that wires adapters to ports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
jacquard-app.workspace = true
jacquard-core.workspace = true
jacquard-ports.workspace = true
jacquard-ledger-fs.workspace = true
jacquard-judge-claude = { path = "../../adapters/jacquard-judge-claude" }
jacquard-renderer-chrome = { path = "../../adapters/jacquard-renderer-chrome" }
jacquard-renderer-playwright = { path = "../../adapters/jacquard-renderer-playwright" }
jacquard-loom-claude = { path = "../../adapters/jacquard-loom-claude" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[lints]
workspace = true
